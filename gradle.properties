# The build now has three Kotlin compilations plus a Compose module, and the default 512 MiB heap
# runs the daemon out of Metaspace mid-build (observed as "Compilation failed: Metaspace" while
# linking the iosSimulatorArm64 test binary). One daemon, enough heap, Kotlin in-process.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
