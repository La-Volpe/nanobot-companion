# Continuous integration.
#
# The policy, in one place and repeated in the README's testing section (T67):
#
#   No gateway secret, API key or device credential ever reaches a hosted runner. The five instruments that
#   need a real gateway or a real device — `:core:jvmTest -Pcontract`, `tools/parity-check.sh`,
#   `tools/session20.sh`, `tools/soak.sh`, `tools/android-session.sh` — never run here. They belong to a
#   `self-hosted` runner on a machine that has a gateway, and to a person who can watch them.
#
# No workflow here may name a secret context at all: everything below runs on public images, and the
# only credentials a job would need belong to the self-hosted instruments above.
#
# What runs where, and why, is in tasks.md T62–T66. The short version:
#   test (ubuntu)      the suites that need no framework and no device
#   macos              :core:jvmTest (it links the iOS framework first), the iOS tests, the coverage gate
#                      (which aggregates the two host suites) and XCUITest
#   connected          the Compose instrumented suite on an emulator — manual dispatch only, because the
#                      emulator is the flaky part of a hosted runner (three runs, three harness failures)
#   builds             release APK/AAB and the CLI zip, with the licence and notices asserted inside them
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The image's SDK manager does not know platform 37; the package is `android-37.0`, not `android-37`.
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS: build-tools;37.0.0

jobs:
  test:
    name: tests (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        # `android-actions/setup-android@v3` fails on this image and the SDK is already there, so the
        # SDK manager is driven directly, from the path the image keeps it at.
        run: |
          set -o pipefail
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: the suites that need no framework and no device
        run: |
          ./gradlew --stacktrace \
            :core:testAndroidHostTest \
            :core-cli:test \
            :app:testDebugUnitTest

      - name: copy parity
        run: python3 tools/parity_copy.py

      - name: keep the reports when a suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-test-reports
          path: |
            core/build/reports/tests/**
            core/build/test-results/**
            app/build/reports/tests/**
            app/build/test-results/**
          retention-days: 7

  macos:
    name: iOS (macos)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        # The coverage gate aggregates `jvmTest` and `testAndroidHostTest`, so this job needs the Android
        # SDK as well as Xcode. The macOS image ships none, so the command-line tools are fetched once.
        run: |
          set -o pipefail
          if [ ! -d "$HOME/android-sdk/cmdline-tools/latest" ]; then
            curl -sSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: the Kotlin/Native half and the coverage gate
        # `:core:jvmTest` links `core.framework` for the simulator before it runs — the bridge shape test
        # reads the header Kotlin/Swift interop actually generates — and no Linux host can do that.
        run: |
          ./gradlew --stacktrace \
            :core:jvmTest \
            :core:iosSimulatorArm64Test \
            :core:koverVerify

      - name: XCUITest on a simulator
        # `CODE_SIGNING_ALLOWED=NO` is not AGENTS gotcha 19: that one is about *device* installs, where an
        # unsigned .app is refused by installd. A simulator test needs no team, and the project's two
        # DEVELOPMENT_TEAM ids are for device builds.
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath .ci-derived \
            -resultBundlePath .ci-results.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: the skip lists, printed rather than asserted
        # The unit suite carries one opt-in skip (210 = 209 + 1 in the local run) and the UI suite the
        # environment ones, whose count varies with which live suites have a gateway. Printing them keeps
        # the numbers honest without pinning a figure the environment owns.
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path .ci-results.xcresult 2>/dev/null || true

      - name: keep the result bundle when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcresult
          path: .ci-results.xcresult
          retention-days: 7

  connected:
    name: Android connected (manual)
    # Manual only, on purpose. Three pull_request runs produced three different harness failures — the
    # emulator action's adb server fighting a pinned ANDROID_SERIAL, an AVD that needed a cold boot before
    # its software keyboard would appear (AGENTS gotcha 28), and one boot that produced no test results at
    # all. None of them were the app, so none of them belong in the signal a merge depends on: this job is
    # here for the day somebody wants Android's UI suite checked on a clean machine, with
    # `gh workflow run ci.yml`. The suites that do gate a PR are `test`, `macos` and `builds`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        run: |
          set -o pipefail
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: instrumented suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          # Cold boot, exactly as on a developer's machine: a snapshot restored emulator can come back with
          # the software keyboard already broken (`mInputShown=false`, AGENTS gotcha 28), and only a cold
          # boot revives it. `KeyboardTests` needs that keyboard to exist at all.
          emulator-options: -no-snapshot-load -no-boot-anim -no-audio -no-window
          # The boot is the flaky part on a shared runner: give it a longer deadline than the 600 s default.
          emulator-boot-timeout: 900
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true
            # No ANDROID_SERIAL: on a runner there is exactly one device and the action owns the adb
            # server, so pinning it here only fights the action ("Unable to connect to adb daemon on
            # port: 5037"). The pin belongs to a developer's machine, where a phone may also be attached.
            # One retry: this job is advisory, and the emulator — not the app — is what fails first.
            # A red that survives two attempts is worth reading; a red that does not is the harness.
            ./gradlew --stacktrace :app:connectedDebugAndroidTest \
              || ./gradlew --stacktrace :app:connectedDebugAndroidTest

      - name: the results, whatever they say
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-connected-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          retention-days: 7

  builds:
    name: release builds (ubuntu)
    # Slow half, and no test depends on it: main and tags, or a deliberate dispatch.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        run: |
          set -o pipefail
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: build the three artefacts
        run: |
          ./gradlew --stacktrace \
            :app:assembleRelease \
            :app:bundleRelease \
            :core-cli:distZip

      - name: the notices must be inside the artefacts
        # A packaging change that drops the licence or the notices fails here instead of being found later.
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          zip=core-cli/build/distributions/core-cli.zip
          for f in "$apk" "$aab" "$zip"; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          unzip -l "$apk" | grep -q "assets/THIRD_PARTY_NOTICES.txt" || { echo "APK lacks the notices"; exit 1; }
          unzip -l "$apk" | grep -q "assets/LICENSE" || { echo "APK lacks the licence"; exit 1; }
          unzip -l "$aab" | grep -q "assets/THIRD_PARTY_NOTICES.txt" || { echo "AAB lacks the notices"; exit 1; }
          unzip -l "$zip" | grep -q "core-cli/THIRD_PARTY_NOTICES.txt" || { echo "CLI zip lacks the notices"; exit 1; }
          echo "notices present in all three artefacts"

      - name: upload them
        uses: actions/upload-artifact@v4
        with:
          name: release-artefacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            core-cli/build/distributions/core-cli.zip
          retention-days: 14
