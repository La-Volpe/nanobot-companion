name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    uses: ./.github/workflows/suites.yml
    with:
      mode: fast
