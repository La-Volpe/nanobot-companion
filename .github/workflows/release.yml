name: Release
run-name: ${{ inputs.publish && 'Publish' || 'Verify' }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag (vMAJOR.MINOR.PATCH, for example v1.0.0)
        type: string
        required: true
      publish:
        description: Create the tag and publish if all checks pass (off = test only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version }}
    steps:
      - name: Require main and an unused version
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Dispatch Release from main.'; exit 1; }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Expected vMAJOR.MINOR.PATCH.'; exit 1;
          }
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "any(.[]; .ref == \"refs/tags/$TAG\")")
          [[ "$existing" == false ]] || { echo 'That tag already exists.'; exit 1; }
          printf 'Candidate: `%s` at `%s`\n' "$TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  full:
    name: Full offline suite
    needs: validate
    uses: ./.github/workflows/suites.yml
    # The release keystore, when the owner has created it. Absent, the same job builds unsigned
    # artefacts and says so; nothing here fails because a secret is missing.
    secrets: inherit
    with:
      mode: full

  publish:
    name: Publish tested commit
    needs: [validate, full]
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && needs.full.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Keyless signing: the attestation is bound to this workflow run and this commit by
      # GitHub's OIDC token, so there is no long-lived key to leak or lose.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-artefacts
          path: release-artefacts

      - name: Bundle the iOS self-build path for a Mac reader
        run: |
          # iOS has no App Store build on purpose (AGENTS gotcha 19), so the release ships the
          # thing that actually works for a stranger: the tested tree, zipped with one top-level
          # folder, and the four commands that build and launch it on their own Mac. `git archive`
          # of this SHA means the bundle is the code the suite just proved, not a later branch.
          stage=release-artefacts/assets
          bundle=nanobot-companion-ios-$TAG
          mkdir -p "$stage/$bundle"
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$stage/$bundle"
          cat > "$stage/$bundle/BUILD-IOS.txt" <<'TXT'
          nanobot Companion on iOS: build it on your own Mac.

            1. Unzip this archive anywhere.
            2. tools/ios-self-build.sh --check        (Xcode, JDK 21, a simulator runtime)
            3. tools/ios-self-build.sh --simulator    build, install, launch; no Apple account needed
            4. tools/ios-self-build.sh --device --team YOURTEAMID   for your own iPhone

          Your free Apple ID's personal team is enough for a device, and its profile expires after
          seven days: rebuild from Xcode (or step 4) to renew it.

          There is no App Store or TestFlight build, by design: this app talks to a gateway you
          run yourself, and shipping it through a store would need a paid Apple account and
          somebody else's signing identity.

          The full notes are in README.md, section "The iOS app on your own Mac".
          TXT
          # The things a reader's first command needs, or this bundle is a dead end.
          for want in tools/ios-self-build.sh gradle/wrapper/gradle-wrapper.jar \
                      iosApp/iosApp.xcodeproj/project.pbxproj BUILD-IOS.txt; do
            test -e "$stage/$bundle/$want" || { echo "::error::the iOS bundle is missing $want"; exit 1; }
          done
          # Nothing personal rides along: the archive is the tracked tree, so prove it.
          for forbidden in .git .dev tasks.md plan.md GATES.md; do
            test ! -e "$stage/$bundle/$forbidden" || { echo "::error::the iOS bundle carries $forbidden"; exit 1; }
          done
          ( cd "$stage" && zip -qr "$RUNNER_TEMP/$bundle.zip" "$bundle" )
          mv "$RUNNER_TEMP/$bundle.zip" "$stage/$bundle.zip"
          python3 - "$stage/$bundle.zip" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          tops = {n.split("/")[0] for n in names}
          assert len(tops) == 1, f"one top-level folder expected, got {sorted(tops)[:5]}"
          assert any(n.endswith("tools/ios-self-build.sh") for n in names), "the bundle lost the script"
          print(f"ios bundle: {len(names)} entries under {tops.pop()}/")
          PY
          ls -l "$stage"

      - name: Require a signed universal APK, and stage the two assets
        run: |
          root=release-artefacts
          apk=$(ls "$root"/app/build/outputs/apk/release/*.apk)
          if [[ "$apk" == *-unsigned.apk ]]; then
            echo "::error::refusing to publish an unsigned APK. Add NANOBOT_KEYSTORE_BASE64, NANOBOT_KEYSTORE_PASSWORD, NANOBOT_KEY_ALIAS and NANOBOT_KEY_PASSWORD, then dispatch again."
            exit 1
          fi
          # Universal: one APK carrying every ABI this app ships, so it installs on a phone, a
          # tablet and an emulator without the reader picking a variant.
          abis=$(unzip -Z1 "$apk" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')
          echo "ABIs: $abis"
          for want in arm64-v8a armeabi-v7a x86_64; do
            [[ "$abis" == *"$want"* ]] || { echo "::error::$apk is missing $want, so it is not universal"; exit 1; }
          done
          stage="$root/assets"
          mkdir -p "$stage"
          cp "$apk" "$stage/nanobot-companion.apk"
          cp "$root/core-cli/build/distributions/core-cli.zip" "$stage/core-cli.zip"
          ls -l "$stage"

      - name: Write the checksums a reader can check without any tool
        run: |
          stage=release-artefacts/assets
          # Plain POSIX and no `find -printf` (GNU-only): the same line runs on the runner and on
          # the reader's Mac, which is the point of a checksum file.
          ( cd "$stage" && for f in *; do
              [ "$f" = SHA256SUMS ] || [ ! -f "$f" ] || shasum -a 256 "$f"
            done | sort -k2 > SHA256SUMS )
          cat "$stage/SHA256SUMS"

      - name: Attest what was built, from this commit, by this workflow
        uses: actions/attest@v4
        with:
          # One provenance statement per published file. `gh attestation verify` checks it
          # against the public Sigstore log, so a reader who downloads a file can prove it came
          # out of this repository's Release workflow for this commit — and nothing else.
          subject-path: release-artefacts/assets/*

      - name: Tag the tested SHA and publish its artefacts
        run: |
          assets=release-artefacts/assets
          files=("$assets"/*)
          test -s "$assets/SHA256SUMS" || { echo "::error::no SHA256SUMS to publish"; exit 1; }
          for file in "${files[@]}"; do test -s "$file"; done
          # Creating the ref is atomic: don't publish an existing tag that might point at another SHA.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes \
            --notes "Tested commit: \`$GITHUB_SHA\`. [Full test run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          - \`nanobot-companion.apk\` — signed universal build for Android 8 and later (arm64-v8a, armeabi-v7a, x86_64, x86).
          - \`core-cli.zip\` — the command-line client.
          ### Verify a download

          \`\`\`
          shasum -a 256 -c SHA256SUMS
          gh attestation verify nanobot-companion-ios-$TAG.zip --repo $GITHUB_REPOSITORY
          \`\`\`

          The checksums catch a truncated download. The attestation is the stronger claim: it is
          signed by this workflow's identity for commit \`$GITHUB_SHA\`, so a file that verifies
          was built here from that commit and has not been swapped since.

          - \`nanobot-companion-ios-$TAG.zip\` — the tested source with \`tools/ios-self-build.sh\`: unzip on a Mac, run it, and the iOS app builds, installs and launches. No Apple account needed for the simulator; a free personal team is enough for your own iPhone (its profile lasts seven days). There is no App Store build on purpose."
