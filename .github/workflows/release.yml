name: Release
run-name: ${{ inputs.publish && 'Publish' || 'Verify' }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag (vMAJOR.MINOR.PATCH, for example v1.0.0)
        type: string
        required: true
      publish:
        description: Create the tag and publish if all checks pass (off = test only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version }}
    steps:
      - name: Require main and an unused version
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Dispatch Release from main.'; exit 1; }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Expected vMAJOR.MINOR.PATCH.'; exit 1;
          }
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq "any(.[]; .ref == \"refs/tags/$TAG\")")
          [[ "$existing" == false ]] || { echo 'That tag already exists.'; exit 1; }
          printf 'Candidate: `%s` at `%s`\n' "$TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  full:
    name: Full offline suite
    needs: validate
    uses: ./.github/workflows/suites.yml
    # The release keystore, when the owner has created it. Absent, the same job builds unsigned
    # artefacts and says so; nothing here fails because a secret is missing.
    secrets: inherit
    with:
      mode: full

  publish:
    name: Publish tested commit
    needs: [validate, full]
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' && needs.full.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artefacts
          path: release-artefacts
      - name: Name the release artefacts for what they are
        run: |
          root=release-artefacts
          apk=$(ls "$root"/app/build/outputs/apk/release/*.apk)
          stage="$root/named"
          mkdir -p "$stage"
          # The signed and unsigned APKs come out of Gradle with different file names, and a reader
          # should not have to know which is which: the published name says it.
          if [[ "$apk" == *"-unsigned.apk" ]]; then
            echo "::warning::this release carries an unsigned APK; add the keystore secrets to sign it"
            cp "$apk" "$stage/nanobot-companion-unsigned.apk"
            echo "UNSIGNED_APK=1" >> "$GITHUB_ENV"
          else
            cp "$apk" "$stage/nanobot-companion.apk"
          fi
          cp "$root/app/build/outputs/apk/debug/app-debug.apk" "$stage/nanobot-companion-debug.apk"
          cp "$root/app/build/outputs/bundle/release/app-release.aab" "$stage/nanobot-companion.aab"
          cp "$root/core-cli/build/distributions/core-cli.zip" "$stage/core-cli.zip"
          ls -l "$stage"

      - name: Tag the tested SHA and publish its artefacts
        run: |
          root=release-artefacts/named
          files=("$root"/*)
          for file in "${files[@]}"; do test -s "$file"; done
          if [[ -n "${UNSIGNED_APK:-}" ]]; then
            caveat="The APK here is **unsigned** — add the keystore secrets to publish an installable one."
          else
            caveat="\`nanobot-companion.apk\` and \`.aab\` are signed with the release key; \`nanobot-companion-debug.apk\` is a throwaway-signed debug build."
          fi
          # Creating the ref is atomic: don't publish an existing tag that might point at another SHA.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes \
            --notes "Tested commit: \`$GITHUB_SHA\`. [Full test run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). $caveat"
