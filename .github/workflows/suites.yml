name: Test suites

on:
  workflow_call:
    inputs:
      mode:
        description: fast, apple, android-ui, or full (all suites and release packaging)
        type: string
        required: true
    # Only the release job has one, and only when the owner has added it. Everything that runs on
    # a pull request gets `fast`/`apple` and never reaches the job that reads this.
    secrets:
      NANOBOT_KEYSTORE_BASE64:
        required: false
      NANOBOT_KEYSTORE_PASSWORD:
        required: false
      NANOBOT_KEY_ALIAS:
        required: false
      NANOBOT_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests
    if: inputs.mode == 'fast' || inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Host tests and compile Android instrumented tests without an emulator
        run: |
          ./gradlew --stacktrace :core:testAndroidHostTest :core-cli:test \
            :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
          python3 tools/require-junit-results.py core/build/test-results/testAndroidHostTest \
            core-cli/build/test-results/test app/build/test-results/testDebugUnitTest
          python3 tools/parity_copy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: |
            core/build/test-results/testAndroidHostTest
            core-cli/build/test-results/test
            app/build/test-results/testDebugUnitTest
          retention-days: 7

  apple:
    name: Apple tests
    if: inputs.mode == 'apple' || inputs.mode == 'full'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Core JVM, Kotlin/Native and coverage
        # The JVM bridge test reads the Swift framework header, so this runs on macOS.
        run: |
          ./gradlew --stacktrace :core:jvmTest :core:iosSimulatorArm64Test :core:koverVerify :core:koverXmlReport
          python3 tools/require-junit-results.py core/build/test-results/jvmTest \
            core/build/test-results/iosSimulatorArm64Test
      - name: Swift unit tests (plus XCUITest in full mode)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          args=()
          if [[ "$MODE" == apple ]]; then args+=(-only-testing:iosAppTests); fi
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/NanobotDerivedData" -resultBundlePath Nanobot.xcresult \
            ${args[@]+"${args[@]}"} CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool get test-results tests --path Nanobot.xcresult > ios-results.json
          jq -e 'any(.testNodes[].children[]; .name == "iosAppTests" and .result == "Passed")' ios-results.json
          if [[ "$MODE" == full ]]; then
            jq -e 'any(.testNodes[].children[]; .name == "iosAppUITests" and .result == "Passed")' ios-results.json
          fi
      - name: Print iOS totals including skips
        if: always()
        run: |
          if [[ -d Nanobot.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path Nanobot.xcresult || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-test-results
          path: |
            Nanobot.xcresult
            ios-results.json
            core/build/test-results/jvmTest
            core/build/test-results/iosSimulatorArm64Test
            core/build/reports/kover/report.xml
          retention-days: 7

  android_ui:
    name: Android connected tests
    if: inputs.mode == 'android-ui' || inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compose tests on a cold-boot API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-load -no-boot-anim -no-audio -no-window
          emulator-boot-timeout: 900
          # The action runs each script line independently and owns the adb server. No ANDROID_SERIAL.
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true
            ./gradlew --stacktrace :app:connectedDebugAndroidTest
      - name: Require an actual test run, not an empty report
        run: python3 tools/require-junit-results.py app/build/outputs/androidTest-results/connected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-connected-results
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          retention-days: 7

  builds:
    name: Release packaging
    if: inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the release keystore, if the repository has one
        env:
          KEYSTORE_BASE64: ${{ secrets.NANOBOT_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::notice::No NANOBOT_KEYSTORE_BASE64 secret: the release artefacts will be unsigned."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "NANOBOT_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "NANOBOT_KEYSTORE_PASSWORD=${{ secrets.NANOBOT_KEYSTORE_PASSWORD }}"
            echo "NANOBOT_KEY_ALIAS=${{ secrets.NANOBOT_KEY_ALIAS }}"
            echo "NANOBOT_KEY_PASSWORD=${{ secrets.NANOBOT_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build and verify the debug APK, release APK and AAB, and the CLI ZIP
        run: |
          ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:bundleRelease :core-cli:distZip
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify "$debug_apk"
          # A signed release is the point of the keystore; an unsigned one is what a fork or a
          # missing secret produces, and the job says which it made instead of guessing later.
          release_apk=$(ls app/build/outputs/apk/release/*.apk)
          if [[ -n "${NANOBOT_KEYSTORE_PATH:-}" ]]; then
            "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$release_apk" \
              | tee /tmp/certs.txt
            grep -qi "Android Debug" /tmp/certs.txt && { echo "::error::the release APK is signed with a debug key"; exit 1; }
            echo "SIGNED=$release_apk" >> "$GITHUB_ENV"
          else
            echo "::warning::$release_apk is unsigned: add the keystore secrets to publish an installable build"
            echo "UNSIGNED=$release_apk" >> "$GITHUB_ENV"
          fi
          check_notices() {
            local entries
            entries=$(unzip -Z1 "$1")
            grep -Fxq "$2/THIRD_PARTY_NOTICES.txt" <<< "$entries"
            grep -Fxq "$2/LICENSE" <<< "$entries"
          }
          check_notices "$debug_apk" assets
          check_notices "$(ls app/build/outputs/apk/release/*.apk)" assets
          check_notices app/build/outputs/bundle/release/app-release.aab base/assets
          check_notices core-cli/build/distributions/core-cli.zip core-cli
      - uses: actions/upload-artifact@v4
        with:
          name: release-artefacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/app-release.aab
            core-cli/build/distributions/core-cli.zip
          if-no-files-found: error
          retention-days: 14
